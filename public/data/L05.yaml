    grammars:
      - id: G-L05-01
        name: 까지
        function: 助词，用于体词后，表示时间/地点的重点或顺序的末尾。
        examples:
          - { sentence: "종로까지 걸어갑니다.", translation: "走到钟路。", focus: "까지", answer: "까지", choices: ["부터", "에", "에서"], hint: "终点助词" }
          - { sentence: "서울에서 부산까지 기차로 5시간 걸립니다.", translation: "从首尔到釜山坐火车需要5个小时。", focus: "까지", answer: "까지", choices: ["부터", "에", "에서"], hint: "终点助词" }
          - { sentence: "12 시에서 1 시까지 점심시간입니다.", translation: "12点到1点是午休时间。", focus: "까지", answer: "까지", choices: ["부터", "에", "에서"], hint: "终点助词" }
          - { sentence: "몇 시까지 갑니까?", translation: "去（到）几点？", focus: "까지", answer: "까지", choices: ["부터", "에", "에서"], hint: "终点助词" }
          - { sentence: "여기까지 하십시오.", translation: "请做到这里（到此为止）。", focus: "까지", answer: "까지", choices: ["부터", "에", "에서"], hint: "终点助词" }

      - id: G-L05-02
        name: -어요/아요/해요
        function: 非格式体终结词尾，用于谓词词干和体词谓词形后，在表示尊敬的同时带有亲切柔和的语气。可用于陈述句、疑问句、命令句和共动句。（格式体陈述-ㅂ니다/습니다，疑问-ㅂ니까/습니까，命令-(으) 십시오，共动-ㅂ시다/읍시다；非格式体陈述/疑问-어요/아요/해요，命令-(으)세요，共动-어요/아요/해요）
        examples:
          - { sentence: "저는 학생이에요.", translation: "我是学生。", focus: "이에요", answer: "이에요", dictionaryForm: "이다", choices: ["이에요?", "입니까", "입니다"], hint: "体词谓词形" }
          - { sentence: "학교에 가요.", translation: "去学校。", focus: "가요", answer: "가요", dictionaryForm: "가다", choices: ["갑니다", "갈까요", "가세요"], hint: "谓词(无收音+아요)" }
          - { sentence: "한국어를 공부해요.", translation: "学习韩语。", focus: "공부해요", answer: "공부해요", dictionaryForm: "공부하다", choices: ["공부합니다", "공부할까요", "공부하세요"], hint: "하다+여요变해요" }

      - id: G-L05-03
        name: -지요?
        function: 终结词尾，用于谓词词干和体词谓词形后，表示说话人对所提问题已有了解，只是希望得到对方的确认。
        examples:
          - { sentence: "날씨가 덥지요?", translation: "天气热吧？", focus: "덥지요", answer: "덥지요", dictionaryForm: "덥다", choices: ["덥습니다", "더울까요", "덥습니까"], hint: "寻求确认" }
          - { sentence: "선생님이 좋지요?", translation: "老师好吧？", focus: "좋지요", answer: "좋지요", dictionaryForm: "좋다", choices: ["좋습니다", "좋을까요", "좋습니까"], hint: "寻求确认" }
          - { sentence: "매일 운동하시지요?", translation: "每天运动吧？", focus: "운동하시지요", answer: "운동하시지요", dictionaryForm: "운동하다", choices: ["운동합니다", "운동할까요", "운동하십니까"], hint: "寻求确认(敬语)" }
          - { sentence: "내일 학교에 가지요?", translation: "明天去学校吧？", focus: "가지요", answer: "가지요", dictionaryForm: "가다", choices: ["갑니다", "갈까요", "갑니까"], hint: "寻求确认" }
          - { sentence: "오늘이 목요일이지요?", translation: "今天是星期四吧？", focus: "목요일이지요", answer: "목요일이지요", dictionaryForm: "목요일이다", choices: ["목요일입니다", "목요일입니까", "목요일이에요"], hint: "寻求确认(体词)" }

      - id: G-L05-04
        name: -(으) 세요
        function: 终结词尾，通过在“-어요/아요/해요”前加上尊称词尾“- (으) 시”而得到，可用于陈述句、疑问句、命令句和共动句。
        examples:
          - { sentence: "이번에는 홍 선생님이 가세요.", translation: "这次洪老师去。", focus: "가세요", answer: "가세요", dictionaryForm: "가다", choices: ["갑니다", "가십시오", "갈까요"], hint: "尊称" }
          - { sentence: "어떤 음식이 좋으세요?", translation: "什么食物好呢？", focus: "좋으세요", answer: "좋으세요", dictionaryForm: "좋다", choices: ["좋습니다", "좋으십니까", "좋을까요"], hint: "尊称(疑问)" }
          - { sentence: "요즘 많이 받으세요?", translation: "最近收得多吗？", focus: "받으세요", answer: "받으세요", dictionaryForm: "받다", choices: ["받습니다", "받으십니까", "받을까요"], hint: "尊称(疑问)" }
          - { sentence: "저와 같이 가세요.", translation: "请和我一起去。", focus: "가세요", answer: "가세요", dictionaryForm: "가다", choices: ["갑니다", "가십시오", "갈까요"], hint: "尊称(命令)" }

      - id: G-L05-05
        name: 에 (时间)
        function: 和表示时间的体词连用，表示动作或状态发生的时间。不与 언제, 오늘, 내일, 어제, 그저께, 모레 等词连用。
        examples:
          - { sentence: "9시에 학교에 갑니다.", translation: "9点去学校。", focus: "9시에", answer: "9시에", choices: ["9시", "9시에서", "9시까지"], hint: "时间助词(几点)" }
          - { sentence: "12시에 점심을 먹습니다.", translation: "12点吃午饭。", focus: "12시에", answer: "12시에", choices: ["12시", "12시에서", "12시까지"], hint: "时间助词(几点)" }
          - { sentence: "내년에 대학교를 졸업합니다.", translation: "明年大学毕业。", focus: "내년에", answer: "내년에", choices: ["내년", "내년에서", "내년까지"], hint: "时间助词(年份)" }
          - { sentence: "겨울에는 날씨가 춥습니다.", translation: "冬天天气冷。", focus: "겨울에는", answer: "겨울에는", choices: ["겨울", "겨울에서", "겨울까지"], hint: "时间助词(季节)" }
          - { sentence: "언제 한국에 오셨습니까?", translation: "什么时候来韩国的？", focus: "한국에", answer: "한국에", choices: ["한국", "한국에서", "한국까지"], hint: "目的地助词(此处不为时间)" }

      - id: G-L05-06
        name: 부터 ~ 까지
        function: 用于体词后，表示某一范围的起止。
        examples: []

      - id: G-L05-07
        name: -고
        function: 连接词尾，和动词词干连用，表示动作发生的顺序。此时，“고”不和过去时词尾“-았/었/했”连用。句子时态由“-고”后的动词决定。
        examples: []

      - id: G-L05-08
        name: -았/었/했
        function: 与谓词词干和体词谓词形连用，表示过去时。
        examples: []