version: "1.0"

lessons:
  - id: L05
    title: 제5과 하루 생활
    order: 5

    topics:
      - id: T-L05-01
        title: 지금 몇 시예요?
        turns:
          - speaker: 리에
            text: 지금 몇 시예요?
            translation: 现在几点了？
          - speaker: 웨이
            text: 한 시 십 분이에요.
            translation: 1点10分。
          - speaker: 리에
            text: 어디에 가요?
            translation: 去哪里？
          - speaker: 웨이
            text: 회사에 가요.
            translation: 去公司。
          - speaker: 리에
            text: 몇 시까지 가요?
            translation: 去（到）几点？
          - speaker: 웨이
            text: 두 시까지 가요.
            translation: 去（到）两点。

      - id: T-L05-02
        title: 오늘이 몇 월 며칠이에요?
        turns:
          - speaker: 리에
            text: 오늘이 몇 월 며칠이에요?
            translation: 今天是几月几号？
          - speaker: 웨이
            text: 시월 팔일이에요.
            translation: 10月8日。
          - speaker: 리에
            text: 목요일이지요?
            translation: 是星期四吧？
          - speaker: 웨이
            text: 아니요, 금요일이에요.
            translation: 不，是星期五。
          - speaker: 리에
            text: 아, 그래요? 그럼 내일 뭐 하세요?
            translation: 啊，是吗？那明天做什么？
          - speaker: 웨이
            text: 글쎄요, 집에서 쉬고 싶어요.
            translation: 嗯（不知道），想在家休息。

      - id: T-L05-03
        title: 일곱 시 반에 일어나요
        turns:
          - speaker: 리에
            text: 아침에 몇 시에 일어나세요?
            translation: 早上几点起床？
          - speaker: 웨이
            text: 7시 반에 일어나요.
            translation: 7点半起床。
          - speaker: 리에
            text: 아침을 먹고 학교에 가세요?
            translation: 吃完早饭去学校吗？
          - speaker: 웨이
            text: 아니요, 아침은 안 먹어요.
            translation: 不，不吃早饭。
          - speaker: 리에
            text: 수업은 날마다 있어요?
            translation: 每天都有课吗？
          - speaker: 웨이
            text: 네, 월요일부터 금요일까지 있어요.
            translation: 是的，从星期一到星期五有课。

      - id: T-L05-04
        title: 친구하고 무엇을 했어요?
        turns:
          - speaker: 리에
            text: 어제 집에서 쉬었어요?
            translation: 昨天在家休息了吗？
          - speaker: 웨이
            text: 아니요, 친구를 만났어요.
            translation: 没有，见朋友了。
          - speaker: 리에
            text: 친구하고 무엇을 했어요?
            translation: 和朋友做什么了？
          - speaker: 웨이
            text: 영화를 봤어요.
            translation: 看电影了。
          - speaker: 리에
            text: 영화가 어땠어요?
            translation: 电影怎么样？
          - speaker: 웨이
            text: 아주 아름다웠어요.
            translation: 非常美。

