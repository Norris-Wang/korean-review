version: "1.0"

lessons:
  - id: L07
    title: 제7과 교통
    order: 7

    topics:
      - id: T-L07-01
        title: 실례지만 길 좀 묻겠습니다
        turns:
          - speaker: 제임스
            text: 실례지만 길 좀 묻겠습니다.
            translation: 打扰一下，我想问个路。
          - speaker: 남자
            text: 어딜 찾으세요?
            translation: 您在找哪里？
          - speaker: 제임스
            text: 연세 아파트가 어디에 있습니까?
            translation: 延世公寓在哪里？
          - speaker: 남자
            text: 잠실역 근처에 있습니다.
            translation: 在蚕室站附近。
          - speaker: 제임스
            text: 잠실역에서 어떻게 갑니까?
            translation: 从蚕室站怎么去？
          - speaker: 남자
            text: 잠실역 6번 출구로 나가서 왼쪽으로 가세요.
            translation: 从蚕室站6号出口出去，往左边走。

      - id: T-L07-02
        title: 지하철로 40분쯤 걸립니다
        turns:
          - speaker: 리에
            text: 여기에서 잠실까지 얼마나 걸려요?
            translation: 从这里到蚕室要多久？
          - speaker: 남자
            text: 지하철로 40분쯤 걸립니다.
            translation: 坐地铁大概需要40分钟。
          - speaker: 리에
            text: 몇 호선을 타요?
            translation: 坐几号线？
          - speaker: 남자
            text: 2호선을 타세요.
            translation: 请坐2号线。
          - speaker: 리에
            text: 버스는 없어요?
            translation: 没有公交车吗？
          - speaker: 남자
            text: 교통이 복잡해서 시간이 많이 걸립니다.
            translation: 交通很复杂，所以花的时间会很长。

      - id: T-L07-03
        title: 사람이 많으니까 조심하세요
        turns:
          - speaker: 리에
            text: 여기 앉을까요?
            translation: 要坐这里吗？
          - speaker: 제임스
            text: 아니요, 앉지 마세요. 다음 역에서 내려요.
            translation: 不，请不要坐。在下一站下车。
          - speaker: 리에
            text: 그럼 문 앞으로 나갈까요?
            translation: 那么要往门前走吗？
          - speaker: 제임스
            text: 네, 저쪽으로 갑시다.
            translation: 是的，往那边走吧。
          - speaker: 리에
            text: 내립니다. 좀 비켜 주십시오.
            translation: 要下车了。请让一让。
          - speaker: 제임스
            text: 사람이 많으니까 조심하세요.
            translation: 人很多，请小心。

      - id: T-L07-04
        title: 과일 가게 앞에 세워 주세요
        turns:
          - speaker: 제임스
            text: 걸어서 갈까요?
            translation: 要走着去吗？
          - speaker: 리에
            text: 머니까 택시를 탑시다.
            translation: 太远了，坐出租车吧。
          - speaker: 기사
            text: 어디로 갈까요?
            translation: 要去哪里？
          - speaker: 제임스
            text: 연세 아파트로 갑시다.
            translation: 去延世公寓吧。
          - speaker: 기사
            text: 어디에 세워 드릴까요?
            translation: 给您停在哪里？
          - speaker: 제임스
            text: 안으로 들어가서 과일 가게 앞에 세워 주세요.
            translation: 请开进去，停在水果店前面。

