version: "1.0"

lessons:
  - id: L01
    title: 제1과 인사
    order: 1

    topics:
      - id: T-L01-01
        title: 안녕하십니까?
        turns:
          - speaker: 리에
            text: 안녕하십니까?
            translation: 您好！
          - speaker: 웨이
            text: 네, 안녕하십니까?
            translation: 是的，您好！
          - speaker: 리에
            text: 리에입니다.
            translation: 我是理惠。
          - speaker: 웨이
            text: 저는 웨이입니다.
            translation: 我是伟。

      - id: T-L01-02
        title: 어느 나라 사람입니까?
        turns:
          - speaker: 리에
            text: 어느 나라 사람입니까?
            translation: 你是哪国人？
          - speaker: 제임스
            text: 미국 사람입니다. 리에 씨는 중국 사람입니까?
            translation: 我是美国人。理惠你是中国人吗？
          - speaker: 리에
            text: 아니요. 저는 일본 사람입니다.
            translation: 不是。我是日本人。
          - speaker: 제임스
            text: 아, 그렇습니까?
            translation: 啊，是吗？

      - id: T-L01-03
        title: 회사원이 아닙니다
        turns:
          - speaker: 리에
            text: 회사원입니까?
            translation: 你是公司职员吗？
          - speaker: 마리아
            text: 아니요, 회사원이 아닙니다.
            translation: 不是，我不是公司职员。
          - speaker: 리에
            text: 그럼 학생입니까?
            translation: 那么是学生吗？
          - speaker: 마리아
            text: 네, 대학생입니다.
            translation: 是的，是大学生。

      - id: T-L01-04
        title: 반갑습니다
        turns:
          - speaker: 미선
            text: 누구입니까?
            translation: 是谁？
          - speaker: 웨이
            text: 제 친구 이영수입니다.
            translation: 是我的朋友李英洙。
          - speaker: 미선
            text: 처음 뵙겠습니다. 김미선입니다.
            translation: 初次见面。我是金美善。
          - speaker: 영수
            text: 안녕하십니까? 반갑습니다.
            translation: 您好！很高兴认识你。

