version: "1.0"

lessons:
  - id: L06
    title: 제6과 물건 사기
    order: 6

    topics:
      - id: T-L06-01
        title: 선물을 사러 갑시다
        turns:
          - speaker: 마리아
            text: 오후에 선물을 사러 갑시다.
            translation: 下午去买礼物吧。
          - speaker: 웨이
            text: 그럽시다. 뭘 살까요?
            translation: 好的。买什么呢？
          - speaker: 마리아
            text: 장미꽃과 케이크를 삽시다.
            translation: 买玫瑰花和蛋糕吧。
          - speaker: 웨이
            text: 어디에서 살까요?
            translation: 在哪里买呢？
          - speaker: 마리아
            text: 학교 앞에 꽃 가게도 있고 빵집도 있어요.
            translation: 学校前面有花店，也有面包店。
          - speaker: 웨이
            text: 그럼 거기에 삽시다.
            translation: 那就在那里买吧。

      - id: T-L06-02
        title: 좋지만 좀 비싸요
        turns:
          - speaker: 마리아
            text: 케이크 있어요?
            translation: 有蛋糕吗？
          - speaker: 주인
            text: 네, 여기 있습니다.
            translation: 是的，在这里。
          - speaker: 마리아
            text: 좀 큰 건 없어요?
            translation: 没有大一点的吗？
          - speaker: 주인
            text: 이 케이크는 어때요?
            translation: 这个蛋糕怎么样？
          - speaker: 마리아
            text: 좋지만 좀 비싸요.
            translation: 好是好，但是有点贵。
          - speaker: 주인
            text: 그럼, 이 치즈 케이크를 사세요.
            translation: 那么，请买这个芝士蛋糕吧。

      - id: T-L06-03
        title: 얼마예요?
        turns:
          - speaker: 웨이
            text: 장미꽃 좀 보여주세요.
            translation: 请给我看看玫瑰花。
          - speaker: 주인
            text: 네, 구경하세요.
            translation: 好的，请随便看。
          - speaker: 웨이
            text: 얼마예요?
            translation: 多少钱？
          - speaker: 주인
            text: 한 송이에 1000원입니다.
            translation: 一朵1000韩元。
          - speaker: 웨이
            text: 이건 얼마예요?
            translation: 这个多少钱？
          - speaker: 주인
            text: 그건 한 송이에 1500원입니다.
            translation: 那个一朵1500韩元。

      - id: T-L06-04
        title: 깎아 주세요
        turns:
          - speaker: 마리아
            text: 장미꽃 10송이 주세요.
            translation: 请给我10朵玫瑰花。
          - speaker: 주인
            text: 누구에게 선물합니까?
            translation: 送给谁？
          - speaker: 마리아
            text: 친구에게 선물해요. 친구가 좋아하는 꽃이에요.
            translation: 送给朋友。是朋友喜欢的花。
          - speaker: 주인
            text: 여기 있습니다. 15000원입니다.
            translation: 给您。15000韩元。
          - speaker: 마리아
            text: 좀 비싸요. 깎아 주세요.
            translation: 有点贵。请给我便宜点吧。
          - speaker: 주인
            text: 그럼 14000원 주십시오.
            translation: 那么请给14000韩元吧。

