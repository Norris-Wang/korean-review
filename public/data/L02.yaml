version: "1.0"

lessons:
  - id: L02
    title: 제2과 학교와 집
    order: 2

    topics:
      - id: T-L02-01
        title: 이것이 교과서입니까?
        turns:
          - speaker: 마리아
            text: 이것이 교과서입니까?
            translation: 这是教科书吗？
          - speaker: 전원
            text: 네, 그렇습니다.
            translation: 是的，是这样。
          - speaker: 마리아
            text: 그럼 저것은 무엇입니까?
            translation: 那么那个是什么？
          - speaker: 전원
            text: 사전입니다.
            translation: 是词典。

      - id: T-L02-02
        title: 지도도 있습니까?
        turns:
          - speaker: 영수
            text: 달력이 있습니까?
            translation: 有日历吗？
          - speaker: 마리아
            text: 네, 있습니다.
            translation: 是的，有。
          - speaker: 영수
            text: 지도도 있습니까?
            translation: 也有地图吗？
          - speaker: 마리아
            text: 아니요, 없습니다.
            translation: 不，没有。

      - id: T-L02-03
        title: 은행이 어디에 있습니까?
        turns:
          - speaker: 마리아
            text: 은행이 어디에 있습니까?
            translation: 银行在哪里？
          - speaker: 전원
            text: 학생회관에 있습니다.
            translation: 在学生馆。
          - speaker: 마리아
            text: 학생회관은 어디에 있습니까?
            translation: 学生馆在哪里？
          - speaker: 전원
            text: 도서관 앞에 있습니다.
            translation: 在图书馆前面。

      - id: T-L02-04
        title: 집이 어디입니까?
        turns:
          - speaker: 영수
            text: 집이 어디입니까?
            translation: 家在哪里？
          - speaker: 마리아
            text: 신촌입니다.
            translation: 在新村。
          - speaker: 영수
            text: 집 근처에 무엇이 있습니까?
            translation: 家附近有什么？
          - speaker: 마리아
            text: 백화점하고 지하철역이 있습니다.
            translation: 有百货商店和地铁站。

