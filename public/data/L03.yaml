version: "1.0"

lessons:
  - id: L03
    title: 제3과 가족과 친구
    order: 3

    topics:
      - id: T-L03-01
        title: 가족 사진을 봅니다
        turns:
          - speaker: 민철
            text: 제임스 씨, 무엇을 합니까?
            translation: 詹姆斯，你在做什么？
          - speaker: 제임스
            text: 가족 사진을 봅니다.
            translation: 在看家族照片。
          - speaker: 민철
            text: 사진을 자주 봅니까?
            translation: 经常看照片吗？
          - speaker: 제임스
            text: 아니요, 가끔 봅니다.
            translation: 不，偶尔看。

      - id: T-L03-02
        title: 부모님은 어디에 계십니까?
        turns:
          - speaker: 민철
            text: 가족이 몇 명입니까?
            translation: 家里有几口人？
          - speaker: 제임스
            text: 아버지, 어머니, 누나 그리고 저 모두 네 사람입니다.
            translation: 爸爸、妈妈、姐姐还有我，一共四个人。
          - speaker: 민철
            text: 부모님은 어디에 계십니까?
            translation: 父母在哪里？
          - speaker: 제임스
            text: 고향에 계십니다.
            translation: 在故乡。

      - id: T-L03-03
        title: 공기도 좋고 조용합니다
        turns:
          - speaker: 민철
            text: 여기가 고향입니까?
            translation: 这里是故乡吗？
          - speaker: 제임스
            text: 네, 우리 고향에는 산이 많습니다.
            translation: 是的，我们故乡山很多。
          - speaker: 민철
            text: 공기가 좋습니까?
            translation: 空气好吗？
          - speaker: 제임스
            text: 네. 공기도 좋고 조용합니다.
            translation: 是的。空气也好，也很安静。

      - id: T-L03-04
        title: 대학교에서 경제학을 공부합니다
        turns:
          - speaker: 민철
            text: 고향에 한국 친구가 있습니까?
            translation: 故乡有韩国朋友吗？
          - speaker: 제임스
            text: 네, 한 명 있습니다.
            translation: 是的，有一名。
          - speaker: 민철
            text: 그 친구는 무엇을 합니까?
            translation: 那个朋友做什么？
          - speaker: 제임스
            text: 대학교에서 경제학을 공부합니다.
            translation: 在大学学习经济学。

