    grammars:
      - id: G-L04-01
        name: 에 가다/오다
        function: 表示主体存在处所的助词 에 与趋向动词 가다/오다 连用，表示动词的目的地
        examples:
          - {
              sentence: "날마다 학교에 갑니다.",
              translation: "每天去学校。",
              focus: "에",
              answer: "에",
              choices: ["에서", "를", "가"],
            }
          - {
              sentence: "친구가 우리집에 옵니다.",
              translation: "朋友来我家。",
              focus: "에",
              answer: "에",
              choices: ["에서", "를", "가"],
            }
          - {
              sentence: "할아버지께서 병원에 가십니다.",
              translation: "爷爷去医院。",
              focus: "에",
              answer: "에",
              choices: ["에서", "를", "가"],
            }
          - {
              sentence: "선생님께서 교실에 들어가십니다.",
              translation: "老师进教室。",
              focus: "에",
              answer: "에",
              choices: ["에서", "를", "가"],
            }

      - id: G-L04-02
        name: -ㄹ까요/을까요?
        function: 用于谓词词干后面的疑问式终结词尾，表示提议或询问意见。终结词尾，和动词词干连用，表示询问对方的意见或想法。
        examples:
          - {
              sentence: "점심을 같이 먹을까요?",
              translation: "一起吃午饭好吗？",
              focus: "먹을까요",
              answer: "먹을까요",
              dictionaryForm: "먹다",
              choices: ["먹습니다", "먹으십시오", "먹겠습니다"],
              hint: "提议/询问",
            }
          - {
              sentence: "도서관에 갈까요?",
              translation: "去图书馆好吗？",
              focus: "갈까요",
              answer: "갈까요",
              dictionaryForm: "가다",
              choices: ["갑니다", "가십시오", "가겠습니다"],
              hint: "提议/询问",
            }
          - {
              sentence: "무슨 영화를 볼까요?",
