              dictionaryForm: "놓다",
              choices: ["놓습니다", "놓으십시오", "놓겠습니다"],
              hint: "询问意见",
            }
          - {
              sentence: "녹차를 드릴까요?",
              translation: "给您绿茶好吗？",
              focus: "드릴까요",
              answer: "드릴까요",
              dictionaryForm: "드리다",
              choices: ["드립니다", "드리십시오", "드리겠습니다"],
              hint: "询问意见",
            }

      - id: G-L04-03
        name: -ㅂ시다/읍시다
        function: 用于动词词干后面的终结词尾，表示提议或接受对方请求。
        examples:
          - {
