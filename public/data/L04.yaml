version: "1.0"

lessons:
  - id: L04
    title: 제4과 음식
    order: 4

    topics:
      - id: T-L04-01
        title: 식당에 갑니다
        turns:
          - speaker: 리에
            text: 마리아 씨, 어디에 갑니까?
            translation: 玛利亚，你去哪里？
          - speaker: 마리아
            text: 식당에 갑니다.
            translation: 去食堂。
          - speaker: 리에
            text: 누구하고 갑니까?
            translation: 和谁一起去？
          - speaker: 마리아
            text: 혼자 갑니다.
            translation: 自己去。
          - speaker: 리에
            text: 같이 갈까요?
            translation: 一起去好吗？
          - speaker: 마리아
            text: 네, 그럽시다.
            translation: 好的，就这么办吧。

      - id: T-L04-02
        title: 무슨 음식을 좋아하십니까?
        turns:
          - speaker: 리에
            text: 무슨 음식을 좋아합니까?
            translation: 喜欢什么食物？
          - speaker: 마리아
            text: 저는 불고기를 좋아합니다.
            translation: 我喜欢烤肉。
          - speaker: 리에
            text: 불고기는 맛이 어떻습니까?
            translation: 烤肉味道怎么样？
          - speaker: 마리아
            text: 아주 맛있습니다.
            translation: 非常好吃。
          - speaker: 리에
            text: 맵지 않습니까?
            translation: 不辣吗？
          - speaker: 마리아
            text: 네, 외국인들도 잘 먹습니다.
            translation: 是的，外国人也能吃得很好。

      - id: T-L04-03
        title: 저는 불고기를 먹고 싶습니다
        turns:
          - speaker: 리에
            text: 이 식당에서는 무슨 음식이 맛있습니까?
            translation: 这家餐厅什么食物好吃？
          - speaker: 마리아
            text: 비빔밥이 맛있습니다.
            translation: 拌饭很好吃。
          - speaker: 리에
            text: 불고기는 어떻습니까?
            translation: 烤肉怎么样？
          - speaker: 마리아
            text: 불고기도 맛있습니다.
            translation: 烤肉也很好吃。
          - speaker: 리에
            text: 저는 불고기를 먹고 싶습니다.
            translation: 我想吃烤肉。
          - speaker: 마리아
            text: 그럼 저는 비빔밥을 먹겠습니다.
            translation: 那么我要吃拌饭。

      - id: T-L04-04
        title: 여기 물 좀 주십시오
        turns:
          - speaker: 마리아
            text: 여기요.
            translation: 服务员（这里）！
          - speaker: 종업원
            text: 네, 뭘 드릴까요?
            translation: 是的，给您拿点什么？
          - speaker: 리에
            text: 저는 불고기를 주십시오.
            translation: 请给我烤肉。
          - speaker: 마리아
            text: 저는 비빔밥을 먹겠습니다.
            translation: 我要吃拌饭。
          - speaker: 종업원
            text: 불고기 일 인분하고 비빔밥 하나요.
            translation: 一份烤肉和一个拌饭，好的。
          - speaker: 리에
            text: 그리고 여기 물 좀 주십시오.
            translation: 还有，请给我点水。

