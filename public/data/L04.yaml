        name: -지 않다
        function: 用于谓词词干后，表示否定。不能用于命令句和共动句。
        examples: []

      - id: G-L04-05
        name: -고 싶다
        function: 用于动词词干后，表示说话人的愿望。第三人称主语用 -고 싶어하다 。
